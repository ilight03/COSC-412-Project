# ===== Ollama Local AI Configuration =====
# Ollama runs locally on the user's machine, providing the AI inference.
# Install Ollama from: https://ollama.com
# After install, pull the model with: ollama pull gemma2:2b
spring.ai.ollama.base-url=http://localhost:11434

# Model to use. gemma2:2b is fast and small (~1.6GB).
# Alternatives:
#   gemma2:9b      - Higher quality, ~5GB, slower
#   llama3.2:3b    - Good balance, ~2GB
#   mistral:7b     - Strong general purpose, ~4GB
#   phi3:mini      - Microsoft's tiny model, ~2GB
# After picking a model, run:  ollama pull <model-name>
spring.ai.ollama.model=gemma2:2b


