<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create Account</title>
        <link rel="stylesheet" href="style.css">

        <title>Favicon</title>
        <link rel="icon" href="data:,">
    </head>

    <body class="login">
        <div class="wrapper">
            <form action="">
                <h1>Create Account</h1>

                <div class="input-box">
                    <input id="createUsernameInput" type="text" placeholder="Username" required>
                </div>

                <div class="input-box">
                    <input id="createPasswordInput" type="password" placeholder="Password" required>
                </div>

                <div class="input-box">
                    <input id="confirmPasswordInput" type="password" placeholder="Confirm Password" required>
                </div>

                <button id="submitCreateBtn" type="submit" class="btn">Create Account</button>
                <button id="backToLoginBtn" type="button" class="btn">Back to Login</button>
                <div class="register-note">
                    <p1>Create-account submit logic will be connected after backend password support is ready.</p1>
                </div>
            </form>
        </div>
    </body>

    <script src="create.js"></script>
</html>
