<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Login</title>
        <link rel="stylesheet" href="style.css">

        <title>Favicon</title>
        <link rel="icon" href="data:,">
    </head>


    <!-- adding id for username/button so js can grab it-->
    <!-- HEADER -->
    <body class="login">
        <div class="wrapper">
            <form action="">
                <h1>Login</h1>
                
                <div class="input-box">
                    <input id=usernameInput type="text" placeHolder="Username" required>
                </div>

                <div class="input-box">
                    <input id="passwordInput" type="password" placeholder="Password" required>
                </div>

            <button id="loginBtn" type="submit" class="btn">Login</button>
            <button id="createAccountBtn" type="button" class="btn">Create Account</button>
            <p id="login-message" class="form-message"></p>
            <div class="register-note">
                <p1>Need an account? Create one here.</p1>
            </div>
            </form>
        </div>
    </body>

    <script src="config.js"></script>
    <script src="login.js"></script>
</html>
