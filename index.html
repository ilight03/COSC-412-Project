<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gradbook Project: COSC-412</title>
        <link rel="stylesheet" href="style.css">
    </head>



    <!-- HEADER -->
    <body>

        <div class="title-container">
            <h1 class="main-title"> Student Helper </h1>
            <h2 class="sub-title"> here to help! </h2>
        </div>



        <!-- ALL WIDGETS-->
        <div class="container-half-page-widgets">
            
            <div class="widget-container"> 

                <!-- TIMER WIDGET-->
                    <h1 class = "sub-title"> Timer </h1>

                    <p class = studyOrBreak > [study mode]</p>


                    <div class = "countdown-container">
        
                        <div class = countdown>
                            <div class = "title"> 
                                <h2 class = "minutes"> 25 </h2>
                            </div>
                            <p>minutes</p>
                        </div>

                        <div class = countdown>
                            <div class = "title"> 
                                <h2 class = "seconds"> 00 </h2>
                            </div>
                            <p>seconds</p>
                        </div>
                    </div>

                    <div class = "button-container">
                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "start"> start </h2>
                            </div>
                        </div>

                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "pause"> pause </h2>
                            </div>
                        </div>

                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "clear"> clear </h2>
                            </div>
                        </div>
                    </div>

            </div>

            <!--CHART WIDGET-->
            <div class="widget-container"> 
                <div class="chart-container">
                    
                    <!--button for generating chart-->
                    <button id= "load-sessions-button" class="grey-button" type="button">click to generate logged study sessions</button>
                    <div class = "chart">
                        <textarea id="sessions-display" class="chart-data-display" placeholder="study sessions will be logged here"></textarea>
                    </div>
                </div>
            </div>
        
        </div>
        
        <!--NOTES WIDGET-->
        <div class="container-full-page-widgets">
            <div class="widget-container"> 
                <div class="notes-container">
                    <h1 class = "sub-title"> Make a Note</h1>

                    <!--notes title request-->
                    <div class = "notes-title-row">
                        <h2 class="sub-title">Title: </h2>
                        <input id="create-note-title" class="title-input" type="text" placeholder="title your notes...">
                    </div>

                    <!--write notes-->
                    <div class = "notes">
                        <textarea id="create-note-content" class="notes-input" placeholder="write your notes here..."></textarea>
                        <button id="save-note-button" class="green-save-button" type="button">save notes</button>
                    </div>
                </div>
            </div>


            <!--RETRIEVE NOTES WIDGET-->
            <div class="widget-container"> 
                <div class="summary-container">
                    <h1 class = "sub-title"> Retrieve Notes</h1>


                    <!--inner widgets: title, summary, read note, save note-->
                    <div class="summary-widget-container">
                        <div class="summary-first-widget-container">
                            <div class="summary-inner-widget">
                                <div class = "search-title-row">
                                    <h2>Search</h2>
                                    <input id="search-note-title" class="title-input" type="text" placeholder="search for a title...">
                                    <button id="search-note-button" class="grey-button" type="button">search</button>

                                </div>
                            </div>
                            <div class="summary-inner-widget"><h2>Summary</h2></div>

                            <!--title request inner widget-->
                            <div class="summary-inner-widget">
                                <div class = "notes-title-row">
                                    <h2 class="sub-title">Title: </h2>
                                    <input id="retrieved-note-title" class="title-input" type="text" placeholder="enter note title here">
                            
                                 </div>
                            </div>

                            <div class="summary-inner-widget"><h2></h2>
                                 <!--button for generating summary-->
                                <button class="grey-button" type="button">click to generate summary</button>
                                <div class = "chart">
                                </div>
                            </div>
                        </div>

                
                        <div class="summary-second-widget-container">
                            <!-- read note inner widget-->
                            <div class="summary-inner-widget"><h2>Read Note</h2>
                                <textarea id="retrieved-note-content" class="chart-data-display" placeholder=""></textarea>
                            </div>
                            
                            <!-- save notes inner widget-->
                            <div class="summary-inner-widget">
                                <div class = "notes">
                                    <button id="update-note-button" class="green-save-button" type="button">update note</button>
                                    <button id="delete-note-button" class="grey-button" type="button">delete note</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
       

    </body>

    <!-- attach javascript-->
    <script src="app.js"></script>
</html>
