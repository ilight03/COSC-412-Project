<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Assistant 🎓</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        #status {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 10px;
        }
        #chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin: 15px 0;
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .ai-message {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }
        #input-container {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: white;
            border-top: 2px solid #f0f0f0;
        }
        #user-input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }
        #user-input:focus {
            border-color: #667eea;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loading {
            color: #ff9800;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.3);
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Student Assistant</h1>
            <div id="status">Initializing...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>
        
        <div id="chat-container"></div>
        
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Ask me anything..." disabled>
            <button id="send-btn" disabled>Send</button>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";
    
        let engine;
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDiv = document.getElementById('status');
        const progressBar = document.getElementById('progress');
    
        // Initialize the AI engine
        async function initAI() {
            try {
                statusDiv.textContent = "Loading AI model (first time: ~2GB download)...";
                statusDiv.className = "loading";
    
                const initProgressCallback = (report) => {
                    console.log(report);
                    statusDiv.textContent = report.text;
                    if (report.progress !== undefined) {
                        const percent = report.progress * 100;
                        progressBar.style.width = percent + '%';
                    }
                };
    
                engine = await webllm.CreateMLCEngine(
                    "Llama-3.2-3B-Instruct-q4f16_1-MLC",
                    { initProgressCallback: initProgressCallback }
                );
    
                statusDiv.textContent = "✨ AI Ready! Ask me anything about your studies.";
                statusDiv.className = "";
                progressBar.style.width = '100%';
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
    
                // Add welcome message
                addMessage("Hello! I'm your AI study assistant. Ask me anything!", false);
    
            } catch (error) {
                statusDiv.textContent = `❌ Error: ${error.message}`;
                statusDiv.className = "";
                console.error(error);
            }
        }
    
        // Add message to chat
        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    
        // Send message to AI
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
    
            addMessage(message, true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            statusDiv.textContent = "🤔 Thinking...";
            statusDiv.className = "loading";
    
            try {
                const messages = [
                    { role: "system", content: "You are a helpful, friendly student assistant. Provide clear, concise answers to help students learn." },
                    { role: "user", content: message }
                ];
    
                const reply = await engine.chat.completions.create({
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 512
                });
    
                const aiResponse = reply.choices[0].message.content;
                addMessage(aiResponse, false);
    
                // Optional: Save to backend
                await saveToBackend(message, aiResponse);
    
            } catch (error) {
                addMessage(`❌ Error: ${error.message}`, false);
                console.error(error);
            } finally {
                statusDiv.textContent = "✨ AI Ready!";
                statusDiv.className = "";
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    
        // Save chat to backend (optional - update URL when deployed)
        async function saveToBackend(userMessage, aiResponse) {
            try {
                await fetch('https://cosc-412-project-1-ri5h.onrender.com/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: userMessage,
                        response: aiResponse,
                        timestamp: new Date().toISOString()
                    })
                });
            } catch (error) {
                console.log('Backend not available:', error);
            }
        }
    
        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    
        // Initialize on load
        initAI();
    </script>
</body>
</html>
