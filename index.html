<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gradbook Project: COSC-412</title>
        <link rel="stylesheet" href="/style.css">
    </head>



    <!-- HEADER -->
    <body>

        <div class="title-container">
            <h1 class="main-title"> Student Helper </h1>
            <h2 class="sub-title"> here to help! </h2>
        </div>



        <!-- WIDGETS-->
        <div class="container-all-widgets">
            
            <div class="widget-container"> 

                <!-- COUNTDOWN-->
                    <h1 class = "sub-title"> Hi i'm your timer </h1>

                    <div class = "countdown-container">
                        <div class = countdown>
                            <div class = "title"> 
                                <h2 class = "minutes"> 25 </h2>
                            </div>
                            <p>minutes</p>
                        </div>

                        <div class = countdown>
                            <div class = "title"> 
                                <h2 class = "seconds"> 00 </h2>
                            </div>
                            <p>seconds</p>
                        </div>
                    </div>

                    <div class = "button-container">
                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "start"> start </h2>
                            </div>
                        </div>

                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "end"> pause </h2>
                            </div>
                        </div>
                    </div>

            </div>


            <div class="widget-container"> 
                <div class="chart-container">
                    <h1 class = "sub-title"> Hi i'm your chart </h1>
                    <div class = "chart">

                    </div>
                </div>
            </div>

            <div class="widget-container"> 
                <div class="notes-container">
                    <h1 class = "sub-title"> Hi i'm your notes</h1>
                    <div class = "notes">

                    </div>
                </div>
            </div>

            <div class="widget-container"> 
                <div class="flashcards-container">
                    <h1 class = "sub-title"> Hi i'm your flashcards</h1>
                    <div class = "flashcards">

                    </div>
                </div>
            </div>

        </div>

    </body>

    <!-- attach javascript-->
    <script src="/app.js"></script>
</html>
