<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gradbook Project: COSC-412</title>
        <link rel="stylesheet" href="style.css">
    </head>



    <!-- HEADER -->
    <body>

        <div class="title-container">
            <h1 class="main-title"> Student Helper </h1>
            <h2 class="sub-title"> here to help! </h2>
        </div>



        <!-- ALL WIDGETS-->
        <div class="container-half-page-widgets">
            
            <div class="widget-container"> 

                <!-- TIMER WIDGET-->
                    <h1 class = "sub-title"> Timer </h1>

                    <p class = studyOrBreak > [study mode]</p>


                    <div class = "countdown-container">
        
                        <div class = countdown>
                            <div class = "title"> 
                                <h2 class = "minutes"> 25 </h2>
                            </div>
                            <p>minutes</p>
                        </div>

                        <div class = countdown>
                            <div class = "title"> 
                                <h2 class = "seconds"> 00 </h2>
                            </div>
                            <p>seconds</p>
                        </div>
                    </div>

                    <div class = "button-container">
                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "start"> start </h2>
                            </div>
                        </div>

                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "end"> pause </h2>
                            </div>
                        </div>

                        <div class = button>
                            <div class = "title"> 
                                <h2 class = "clear"> clear </h2>
                            </div>
                        </div>
                    </div>

            </div>

            <!--CHART WIDGET-->
            <div class="widget-container"> 
                <div class="chart-container">
                    <h1 class = "sub-title"> Chart </h1>
                    <div class = "chart">

                    </div>
                </div>
            </div>
        
        </div>
        
        <!--NOTES WIDGET-->
        <div class="container-full-page-widgets">
            <div class="widget-container"> 
                <div class="notes-container">
                    <h1 class = "sub-title"> Notes</h1>

                    <!--notes title request-->
                    <div class = "notes-title-row">
                        <h2 class="sub-title">Title: </h2>
                        <input class="title-input" type="text" placeholder="title your notes..."></textarea>
                    </div>

                    <!--write notes-->
                    <div class = "notes">
                        <textarea class="notes-input" placeholder="write your notes here..."></textarea>
                        <button class="notes-save" type="button">save notes</button>
                    </div>
                </div>
            </div>


            <!--RETRIEVE NOTES WIDGET-->
            <div class="widget-container"> 
                <div class="summary-container">
                    <h1 class = "sub-title"> Retrieve Notes</h1>


                    <!--inner widgets: title, summary, read note, save note-->
                    <div class="summary-widget-container">
                        <div class="summary-first-widget-container">

                            <!--title request inner widget-->
                            <div class="summary-inner-widget">
                                <div class = "notes-title-row">
                                    <h2 class="sub-title">Title: </h2>
                                    <input class="title-input" type="text" placeholder="enter note title here"></textarea>
                                </div>
                            </div>

                            <div class="summary-inner-widget"><h2>Summary</h2></div>
                        </div>

                
                        <div class="summary-second-widget-container">
                            <!-- read note inner widget-->
                            <div class="summary-inner-widget"><h2>Read Note</h2></div>
                            
                            <!-- save notes inner widget-->
                            <div class="summary-inner-widget">
                                <div class = "notes">
                                    <button class="notes-save" type="button">save notes</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
       

    </body>

    <!-- attach javascript-->
    <script src="app.js"></script>
</html>
