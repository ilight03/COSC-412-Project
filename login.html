<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Login</title>
        <link rel="stylesheet" href="style.css">
    </head>


    <!-- adding id for username/button so js can grab it-->
    <!-- HEADER -->
    <body class="login">
        <div class="wrapper">
            <form action="">
                <h1>Login</h1>
                
                <div class="input-box">
                    <input id=usernameInput type="text" placeHolder="Username" required>
                </div>

            <button id="loginBtn" type="submit" class="btn">Login</button>
            <div class="register-note">
                <p1>user will be registered if account does not exist</p1>
            </div>
            </form>
        </div>
    </body>

    <!-- attach javascript: i changed and added a new .js file-->
    <script src="login.js"></script>
</html>
